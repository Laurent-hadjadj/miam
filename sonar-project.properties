sonar.projectKey=fr.ma-moulinette:miam
sonar.projectName=MIAM

# SonarQube auto-hébergé local (sans cette ligne, certains
# scanners basculent par défaut sur sonarcloud.io, qui exige en plus
# sonar.organization). Token à passer via SONAR_TOKEN.
sonar.host.url=http://localhost:9000

# Deux parties de code : Angular (src/) et le BFF Node/Express (server/),
# qui porte les identifiants Actuator — composant le plus sensible du projet,
# a analyser au meme titre que le front.
sonar.sources=src,server
sonar.tests=src,server/test
sonar.test.inclusions=**/*.spec.ts,server/test/**/*.test.js

# dist/build, assets statiques/logos, config CAS, rapports ZAP et cache
# Angular : donnees/artefacts, pas du code applicatif.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,design/**,toolz/**,cas/**,security/**,public/**

# Couverture : Angular/vitest -> npm run test:coverage (coverage/miam/lcov.info,
# "miam" = nom du projet dans angular.json, pas coverage/lcov.info).
# BFF -> npm run coverage:bff (coverage-bff/lcov.info).
sonar.javascript.lcov.reportPaths=coverage/miam/lcov.info,coverage-bff/lcov.info
sonar.typescript.lcov.reportPaths=coverage/miam/lcov.info

sonar.sourceEncoding=UTF-8
